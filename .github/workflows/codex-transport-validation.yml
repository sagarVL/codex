name: Codex transport investigation

on:
  push:
    branches: [validation/windows-antivirus]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-transport-${{ github.ref }}
  cancel-in-progress: true

jobs:
  transport:
    if: github.repository != 'openai/codex'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      BASE_SHA: 67f0994b532b8740f14b5b738af7b7b2a915b1d6
      RUST_MIN_STACK: '8388608'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
    steps:
      - name: Fetch pinned upstream source and validation files
        run: |
          set -euo pipefail
          git config --global core.longpaths true
          git init codex
          git -C codex remote add origin https://github.com/openai/codex.git
          git -C codex fetch --depth 1 origin "$BASE_SHA"
          git -C codex checkout --detach FETCH_HEAD
          test "$(git -C codex rev-parse HEAD)" = "$BASE_SHA"
          for file in prepare_transport_workspace.py verify_lock.py regression-tests.patch; do
            curl --fail --location --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/validation/${file}" \
              --output "$file"
          done
          git -C codex apply --check ../regression-tests.patch
          git -C codex apply ../regression-tests.patch
          python prepare_transport_workspace.py

      - name: Install the repository's pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component rustfmt,clippy

      - name: Resolve focused dependencies and check version provenance
        id: dependencies
        working-directory: transport-source
        run: |
          set -euo pipefail
          cargo +1.95.0 metadata --format-version 1 > ../resolved-metadata.json
          python ../verify_lock.py ../codex/codex-rs/Cargo.lock Cargo.lock

      - name: Report test environment overrides
        run: python -c "import os; print({key: bool(os.environ.get(key)) for key in ('CODEX_CA_CERTIFICATE', 'SSL_CERT_FILE', 'SSL_CERT_DIR', 'HTTPS_PROXY', 'HTTP_PROXY')})"

      - name: Check formatting of the proposed test additions
        working-directory: codex/codex-rs
        run: |
          rustup run 1.95.0 rustfmt --edition 2024 --check \
            codex-api/src/endpoint/responses_websocket.rs \
            core/tests/suite/websocket_fallback.rs \
            websocket-client/src/dialer_tests.rs

      - name: Run API library tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: transport-source
        run: cargo +1.95.0 test --locked -j 2 -p codex-api --lib

      - name: Run HTTP library tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: transport-source
        run: cargo +1.95.0 test --locked -j 2 -p codex-http-client --lib

      - name: Run WebSocket library tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: transport-source
        run: cargo +1.95.0 test --locked -j 2 -p codex-websocket-client --lib

      - name: Run custom CA integration tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: transport-source
        run: cargo +1.95.0 test --locked -j 2 -p codex-http-client --test ca_env

      - name: Run transport lint checks
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        working-directory: transport-source
        run: cargo +1.95.0 clippy --locked -j 2 -p codex-api -p codex-http-client -p codex-websocket-client --lib --tests -- -D warnings
